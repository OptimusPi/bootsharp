name: docs

on:
  workflow_dispatch: { }
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v6
      - name: fetch tags
        run: git fetch --prune --unshallow --tags
      - uses: actions/setup-node@v6
      - name: build
        run: |
          npm i --prefix src/js
          cd docs
          npm install
          npm run docs:api
          npm run docs:build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist
      - uses: actions/deploy-pages@v5
