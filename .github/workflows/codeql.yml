name: codeql

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: setup dotnet
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10
      - name: initialize codeql
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: build
        if: matrix.build-mode == 'manual'
        run: |
          cd src/cs
          bash ./.scripts/llvm.sh
          bash ./.scripts/pack.sh
      - name: analyze
        uses: github/codeql-action/analyze@v4
